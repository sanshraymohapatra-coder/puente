<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puente — Live Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a202c;
      letter-spacing: -0.5px;
    }
    .page-header h1 span {
      color: #3b82f6;
    }
    .page-header p {
      margin-top: 6px;
      color: #64748b;
      font-size: 15px;
    }

    /* ── Phone shell ─────────────────────────────────────────────────── */
    .phone {
      width: 360px;
      background: #1c1c1e;
      border-radius: 44px;
      padding: 14px 10px;
      box-shadow:
        0 0 0 2px #3a3a3c,
        0 30px 80px rgba(0,0,0,0.35);
    }

    .phone-inner {
      background: #fff;
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 620px;
    }

    /* ── Status bar ──────────────────────────────────────────────────── */
    .status-bar {
      background: #f9f9f9;
      padding: 10px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #1c1c1e;
    }
    .status-bar .time { font-size: 15px; font-weight: 700; }
    .status-bar .icons { display: flex; gap: 6px; align-items: center; }

    /* ── Conversation header ─────────────────────────────────────────── */
    .convo-header {
      background: #f9f9f9;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 16px;
      flex-shrink: 0;
    }
    .convo-info .name { font-weight: 600; font-size: 15px; color: #1c1c1e; }
    .convo-info .subtitle { font-size: 12px; color: #6b7280; margin-top: 1px; }

    /* ── Messages area ───────────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .bubble-row.from-user { justify-content: flex-end; }
    .bubble-row.from-bot  { justify-content: flex-start; }

    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble-row.from-user .bubble {
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-row.from-bot .bubble {
      background: #f3f4f6;
      color: #1c1c1e;
      border-bottom-left-radius: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
      margin: 4px 0;
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-items: flex-end;
      gap: 6px;
    }
    .typing-indicator.visible { display: flex; }
    .typing-dots {
      background: #f3f4f6;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Input area ──────────────────────────────────────────────────── */
    .input-area {
      padding: 10px 12px 14px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
    }
    .input-area input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 22px;
      padding: 9px 16px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      color: #1c1c1e;
    }
    .input-area input:focus { border-color: #3b82f6; }
    .input-area button {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .input-area button:hover { background: #2563eb; }
    .input-area button:active { transform: scale(0.93); }
    .input-area button:disabled { background: #93c5fd; cursor: not-allowed; }
    .send-icon {
      width: 16px; height: 16px;
      fill: #fff;
    }

    /* ── Reset button ────────────────────────────────────────────────── */
    .reset-row {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .reset-btn {
      padding: 9px 20px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 14px;
      color: #374151;
      cursor: pointer;
      transition: background 0.15s;
    }
    .reset-btn:hover { background: #f9fafb; }

    .hint {
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <h1>Puente <span>Demo</span></h1>
    <p>Type a message below to experience the SMS flow — just like a patient would.</p>
  </div>

  <!-- Phone shell -->
  <div class="phone">
    <div class="phone-inner">

      <div class="status-bar">
        <span class="time" id="clock">9:41</span>
        <span class="icons">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
            <rect x="0" y="3" width="3" height="9" rx="1"/>
            <rect x="4.5" y="2" width="3" height="10" rx="1"/>
            <rect x="9" y="0.5" width="3" height="11.5" rx="1"/>
            <rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity=".3"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
            <path d="M8 2.5C10.5 2.5 12.7 3.6 14.2 5.3L15.5 4C13.7 2 11 .8 8 .8S2.3 2 .5 4L1.8 5.3C3.3 3.6 5.5 2.5 8 2.5Z"/>
            <path d="M8 5.5c1.7 0 3.2.7 4.3 1.8L13.6 6c-1.4-1.5-3.4-2.4-5.6-2.4S2.8 4.5 1.4 6l1.3 1.3C3.8 6.2 5.3 5.5 8 5.5Z"/>
            <circle cx="8" cy="10.5" r="1.5"/>
          </svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor">
            <rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1.2" fill="none"/>
            <rect x="1.5" y="2.5" width="16" height="7" rx="2"/>
            <path d="M22 4.5v3a1.5 1.5 0 000-3Z"/>
          </svg>
        </span>
      </div>

      <div class="convo-header">
        <div class="avatar">P</div>
        <div class="convo-info">
          <div class="name">Puente Health</div>
          <div class="subtitle">Free resource navigator · SMS</div>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="timestamp">Today</div>
        <!-- messages injected by JS -->
      </div>

      <div class="typing-indicator" id="typing">
        <div class="typing-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder='Try "hi", "hola", "FA", or "HINDI"' autocomplete="off" />
        <button id="sendBtn" onclick="sendMessage()">
          <svg class="send-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <div class="reset-row">
    <button class="reset-btn" onclick="resetSession()">↺ Reset conversation</button>
    <span class="hint">Each reset starts a fresh session</span>
  </div>

<script>
  // Unique session ID per page load so multiple demos don't collide
  let sessionId = crypto.randomUUID();

  function currentTime() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Detect Arabic/Farsi script to apply RTL direction on the bubble
  function isRTL(text) {
    return /[؀-ۿ]/.test(text);
  }

  function appendBubble(text, role) {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'bubble-row from-' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    if (isRTL(text)) {
      bubble.dir = 'rtl';
      bubble.style.textAlign = 'right';
    }
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const btn   = document.getElementById('sendBtn');
    const text  = input.value.trim();
    if (!text) return;

    input.value = '';
    input.disabled = true;
    btn.disabled = true;

    appendBubble(text, 'user');

    // Show typing indicator
    const typing = document.getElementById('typing');
    const messages = document.getElementById('messages');
    messages.appendChild(typing);
    typing.classList.add('visible');
    messages.scrollTop = messages.scrollHeight;

    try {
      const res = await fetch('/demo/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: text, session_id: sessionId }),
      });
      const data = await res.json();

      // Simulate brief typing delay for realism
      await new Promise(r => setTimeout(r, 400));

      typing.classList.remove('visible');
      appendBubble(data.reply, 'bot');
    } catch (e) {
      typing.classList.remove('visible');
      appendBubble('⚠️ Could not reach the server.', 'bot');
    }

    input.disabled = false;
    btn.disabled = false;
    input.focus();
  }

  function resetSession() {
    sessionId = crypto.randomUUID();
    const messages = document.getElementById('messages');
    messages.innerHTML = '<div class="timestamp">Today</div>';
    document.getElementById('userInput').value = '';
    document.getElementById('userInput').focus();
  }

  // Send on Enter
  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  // Live clock
  function updateClock() {
    document.getElementById('clock').textContent = currentTime();
  }
  updateClock();
  setInterval(updateClock, 30000);
</script>
</body>
</html>
